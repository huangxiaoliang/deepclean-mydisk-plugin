name: Windows acceptance

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/windows-acceptance.yml'
      - 'scripts/windows-ci/**'
      - 'lib/**'
      - 'resources/**'
      - 'tests/**'
      - 'package.json'
  pull_request:
    paths:
      - '.github/workflows/windows-acceptance.yml'
      - 'scripts/windows-ci/**'
      - 'lib/**'
      - 'resources/**'
      - 'tests/**'
      - 'package.json'

permissions:
  contents: read

concurrency:
  group: windows-acceptance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: Native acceptance (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
          - os: windows-2025
          # Windows 11 Arm64 客户端镜像：真实客户端 OS，不是 Server。
          # 客户端镜像可能缺少可丢弃的卷管理能力，跨卷用例显式 SKIP 并写进 summary。
          - os: windows-11-arm
            allow_missing_volume: '1'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      DEEPCLEAN_CI_ALLOW_MISSING_VOLUME: ${{ matrix.allow_missing_volume || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Run native acceptance and collect diagnostics
        run: node scripts/windows-ci/run.mjs
      - name: Upload reports even when acceptance fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-acceptance-${{ matrix.os }}-${{ github.run_attempt }}
          path: acceptance-report/windows-ci/
          if-no-files-found: warn
          retention-days: 14
