name: Windows acceptance

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/windows-acceptance.yml'
      - 'scripts/windows-ci/**'
      - 'lib/**'
      - 'resources/**'
      - 'tests/**'
      - 'package.json'
  pull_request:
    paths:
      - '.github/workflows/windows-acceptance.yml'
      - 'scripts/windows-ci/**'
      - 'lib/**'
      - 'resources/**'
      - 'tests/**'
      - 'package.json'

permissions:
  contents: read

concurrency:
  group: windows-acceptance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: Native acceptance (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: npm install --no-audit --no-fund --no-package-lock
      - name: Run native acceptance and collect diagnostics
        run: node scripts/windows-ci/run.mjs
      - name: Upload reports even when acceptance fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-acceptance-${{ matrix.os }}-${{ github.run_attempt }}
          path: acceptance-report/windows-ci/
          if-no-files-found: warn
          retention-days: 14
